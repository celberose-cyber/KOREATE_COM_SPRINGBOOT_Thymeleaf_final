<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8"/>
  <title>장바구니</title>
  <style>
    .actions{
      display:flex;
      justify-content:space-between; /* ✅ 왼쪽/오른쪽 */
      align-items:center;
      margin-top:12px;
      gap:10px;
    }
    .actions-left{ display:flex; gap:10px; }
    .actions-right{ display:flex; gap:10px; }
    .cart-wrap{max-width:980px;margin:0 auto;padding:0 12px;}
    .cart-table{width:100%;border-collapse:collapse;}
    .cart-table th,.cart-table td{border-bottom:1px solid #eee;padding:10px;vertical-align:middle;}
    .thumb{width:72px;height:72px;object-fit:contain;border:1px solid #eee;border-radius:8px;background:#fff;}
    .name a{text-decoration:none;color:#111;}
    .muted{color:#777;font-size:13px;}
    /* 수량 영역 전체 간격은 그대로 */
    .qty-box{
      display:inline-flex;
      align-items:center;
      gap:6px;
    }

    /* - + 버튼은 그대로 두거나 살짝만 */
    .qty-btn{
      width:22px;        /* 28 → 26 */
      height:26px;
      font-size:14px;
    }

    /* ✅ 수량 입력칸만 축소 */
    .qty-input{
      width:34px;
      height:26px;
      box-sizing:border-box;
      padding:0;
      margin:0;
      font-size:14px;
      line-height:26px;     /* ✅ 높이와 동일하게 */
      text-align:center;
      border:1px solid #ccc;
      border-radius:6px;
    }

    /* ✅ 적용 버튼만 작게 */
    .qty-box .btn{
      padding:4px 8px !important;
      height:26px !important;
      line-height:1 !important;
      font-size:13px !important;
    }

    .right{text-align:right;}
    .sum-box{margin-top:16px;border:1px solid #eee;border-radius:12px;padding:14px;}
    .sum-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;}
    .sum-row b{font-size:16px;}
    .sum-strong{font-size:18px;}
    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;}
    .btn-primary{border:none;background:#111;color:#fff;}
    .btn-danger{border:none;background:#c0392b;color:#fff;}
    .empty{padding:20px;border:1px dashed #ccc;border-radius:12px;text-align:center;color:#666;}
    .qty-box{
      display:inline-flex;
      align-items:center;
      gap:6px;
      flex-wrap:nowrap;     /* ✅ 줄바꿈 금지 */
      white-space:nowrap;   /* ✅ 텍스트 줄바꿈 금지 */
    }

    .qty-input{
      width:34px;
      min-width:34px;       /* ✅ 숫자 커져도 폭 고정 */
      max-width:34px;       /* ✅ 숫자 커져도 폭 고정 */
      height:26px;
      box-sizing:border-box;
      padding:0;
      margin:0;
      font-size:14px;
      line-height:26px;
      text-align:center;
    }
    .cart-table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;   /* ✅ 열 폭을 고정해서 줄바꿈/흔들림 줄임 */
    }
    /* 단가(3), 소계(5), 삭제(6) 열은 한 줄 유지 */
    .cart-table th:nth-child(3),
    .cart-table td:nth-child(3),
    .cart-table th:nth-child(5),
    .cart-table td:nth-child(5),
    .cart-table th:nth-child(6),
    .cart-table td:nth-child(6){
      white-space:nowrap;   /* ✅ 원/버튼 줄바꿈 방지 */
    }
    /* 정보(2) 열: 넘치면 ... */
    .cart-table td:nth-child(2){
      overflow:hidden;
    }

    .cart-table td:nth-child(2) a{
      display:block;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

  </style>
</head>
<body>

<div th:replace="common/header :: header"></div>

<div class="cart-wrap">
  <h2>장바구니</h2>

  <!-- 비어있을 때 -->
  <div class="empty" th:if="${#lists.isEmpty(items)}">
    장바구니가 비어있습니다.
    <div style="margin-top:10px;">
      <a th:href="@{/products(category='computer')}">상품 보러가기</a>
    </div>
  </div>

  <!-- 아이템 있을 때 -->
  <div th:if="${!#lists.isEmpty(items)}">
    <table class="cart-table">
      <thead>
      <tr>
        <th>상품</th>
        <th>정보</th>
        <th class="right">단가</th>
        <th>수량</th>
        <th class="right">소계</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="it : ${items}">
        <td>
          <img class="thumb" th:if="${it.thumbnailUrl}" th:src="${it.thumbnailUrl}" alt="thumb"/>
          <div th:if="${it.thumbnailUrl == null}" class="thumb" style="display:flex;align-items:center;justify-content:center;">
            <span class="muted">no image</span>
          </div>
        </td>

        <td class="name">
          <!-- 상품 상세로 이동 -->
          <a th:href="@{/product(id=${it.productId})}" th:text="${it.productName}">상품명</a>
          <div class="muted">상품ID: <span th:text="${it.productId}">0</span></div>
        </td>

        <td class="right">
          <span th:text="${#numbers.formatInteger(it.unitPrice, 0, 'COMMA')}">0</span>원
        </td>

        <td>
          <!-- ✅ +/- 버튼: update action으로 POST -->
          <div class="qty-box">
            <!-- - 버튼 (qty-1) -->
            <form th:action="@{/cart}" method="post" style="display:inline;"
                  th:onsubmit="${it.quantity - 1} <= 0 ? 'return confirm(\'수량이 0이 되면 삭제됩니다. 삭제할까요?\')' : 'return true'">
              <input type="hidden" name="action" value="update"/>
              <input type="hidden" name="cartItemId" th:value="${it.cartItemId}"/>
              <input type="hidden" name="qty" th:value="${it.quantity - 1}"/>
              <button class="qty-btn" type="submit">-</button>
            </form>

            <!-- 현재 수량 표시/직접 입력 -->
            <form th:action="@{/cart}" method="post" style="display:inline;"
                  onsubmit="const q=this.qty.valueAsNumber; if(q<=0){return confirm('수량이 0이면 삭제됩니다. 삭제할까요?');} return true;">
              <input type="hidden" name="action" value="update"/>
              <input type="hidden" name="cartItemId" th:value="${it.cartItemId}"/>
              <input class="qty-input" type="number" name="qty" min="0" th:value="${it.quantity}"/>
              <button class="btn" type="submit">적용</button>
            </form>

            <!-- + 버튼 (qty+1) -->
            <form th:action="@{/cart}" method="post" style="display:inline;">
              <input type="hidden" name="action" value="update"/>
              <input type="hidden" name="cartItemId" th:value="${it.cartItemId}"/>
              <input type="hidden" name="qty" th:value="${it.quantity + 1}"/>
              <button class="qty-btn" type="submit">+</button>
            </form>
          </div>
        </td>

        <td class="right">
          <span th:text="${#numbers.formatInteger(it.unitPrice * it.quantity, 0, 'COMMA')}">0</span>원
        </td>

        <td class="right">
          <!-- 삭제 -->
          <form th:action="@{/cart}" method="post" style="display:inline;"
                onsubmit="return confirm('이 상품을 삭제할까요?');">
            <input type="hidden" name="action" value="delete"/>
            <input type="hidden" name="cartItemId" th:value="${it.cartItemId}"/>
            <button class="btn btn-danger" type="submit">삭제</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

    <!-- 합계/혜택 요약 -->
    <div class="sum-box">
      <div class="sum-row">
        <span>합계</span>
        <b><span th:text="${#numbers.formatInteger(total, 0, 'COMMA')}">0</span>원</b>
      </div>

      <div class="sum-row">
        <span>
          할인율
          <span class="muted">(등급혜택)</span>
        </span>
        <b>
          <span th:text="${discountRate}">0</span>%
          &nbsp;→&nbsp;
          -<span th:text="${#numbers.formatInteger(discountAmount, 0, 'COMMA')}">0</span>원
        </b>
      </div>

      <div class="sum-row">
        <span class="sum-strong">할인 적용 소계(결제예정)</span>
        <b class="sum-strong">
          <span th:text="${#numbers.formatInteger(discountedTotal, 0, 'COMMA')}">0</span>원
        </b>
      </div>

      <div class="sum-row">
        <span>
          예상 적립
          <span class="muted">(적립률 <span th:text="${pointRate}">0</span>%)</span>
        </span>
        <b>
          <span th:text="${#numbers.formatInteger(expectedPoint, 0, 'COMMA')}">0</span>P
        </b>
      </div>

      <div class="actions">
        <div class="actions-left">
          <!-- 전체삭제 -->
          <form th:action="@{/cart}" method="post"
                onsubmit="return confirm('장바구니를 모두 비울까요?');"
                style="margin:0;">
            <input type="hidden" name="action" value="clear"/>
            <button class="btn" type="submit">전체삭제</button>
          </form>
        </div>

        <div class="actions-right">
          <!-- 구매하기 -->
          <a class="btn btn-primary" th:href="@{/order/checkout}">
            구매하기
          </a>
        </div>
      </div>

    </div>
  </div>
</div>
</div>

<div th:replace="common/footer :: footer"></div>
</body>
</html>
