<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>고객 안내</title>
</head>
<body>

<div th:replace="common/header :: header"></div>

<div class="wrap">
    <div class="card">
        <div class="card-hd">
            <h2 class="title">고객 안내</h2>
            <span class="badge">HELP</span>
        </div>

        <!-- ✅ 버튼형 메뉴 -->
        <div class="quick-grid">
            <button class="qbtn" data-action="intro">매장/취급 품목 안내</button>
            <button class="qbtn" data-action="top10">TOP10 상품 추천</button>
            <button class="qbtn" data-action="policy">회원정책 안내</button>
            <button class="qbtn" data-action="pay">결제방법 안내</button>
        </div>

        <!-- ✅ 응답 출력 -->
        <div id="panel" class="panel" style="margin-top:12px;">
            <div class="muted">위 버튼을 눌러 안내를 확인하세요.</div>
        </div>
        <div class="chatbox" style="margin-top:12px;">
            <div class="chat-hd">
                <div class="chat-title">도움말 챗봇</div>
                <div class="muted">질문을 입력해보세요.</div>
            </div>

            <div id="chatLog" class="chat-log"></div>

            <div class="chat-row">
                <input id="chatInput" class="chat-input" type="text" placeholder="예) 안녕" />
                <button id="sendBtn" class="chat-send" type="button">전송</button>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const CTX     = /*[[@{/}]]*/ "/";        // ✅ 루트 컨텍스트 경로
    const HELP_API = /*[[@{/api/help}]]*/ "/api/help";
</script>
<script th:src="@{/assets/js/helpbot.js}"></script>

<style>
    .wrap{max-width:1100px;margin:0 auto;padding:20px;}
    .muted{color:#777;font-size:13px;}

    .card{border:1px solid #e5e5e5;border-radius:12px;background:#fff;padding:14px 16px;}
    .card-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;
        padding-bottom:10px;border-bottom:1px solid #eee;margin-bottom:10px;}
    .title{font-weight:900;margin:0;}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid #ddd;
        font-size:12px;font-weight:800;background:#fafafa;}

    .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
    .qbtn{
        padding:12px;border-radius:12px;border:1px solid #ddd;background:#fff;
        font-weight:900;cursor:pointer;text-align:left;
    }
    .qbtn:hover{background:#f7f7f7;}

    .panel{
        border:1px solid #eee;border-radius:12px;background:#fafafa;padding:12px;
        height:120px;
        overflow-y:auto;
    }

    .box{border:1px solid #e5e5e5;border-radius:12px;background:#fff;padding:12px;margin:10px 0;}
    .box-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
    .box-title{font-weight:900;}
    .pill{font-size:12px;font-weight:900;border:1px solid #ddd;border-radius:999px;padding:3px 10px;background:#fafafa;}
    .list{display:flex;flex-direction:column;gap:8px;}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center;}
    .name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .meta{font-size:13px;color:#666;display:flex;gap:10px;flex-wrap:wrap;}

    @media (max-width:900px){
        .quick-grid{grid-template-columns:repeat(2,1fr);}
    }
    .ctrl{border:1px solid #eee;border-radius:12px;background:#fff;padding:10px;}
    .ctrl-title{font-weight:900;margin-bottom:8px;}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
    .chip{
        padding:8px 10px;border-radius:999px;border:1px solid #ddd;background:#fff;
        font-weight:900;cursor:pointer;font-size:13px;
    }
    .chip:hover{background:#f7f7f7;}
    .chip.active{border-color:#111;background:#111;color:#fff;}

    /* 카테고리 버튼(pill) 버튼화 */
    button.pill {
        cursor: pointer;
        transition: transform .06s ease, background .15s ease, border-color .15s ease;
    }
    button.pill:hover {
        background: #f2f2f2;
        border-color: #bbb;
        transform: translateY(-1px);
    }
    button.pill:active {
        transform: translateY(0);
    }
    button.pill:focus-visible {
        outline: 2px solid #111;
        outline-offset: 2px;
    }
    .chatbox{border:1px solid #eee;border-radius:12px;background:#fff;padding:12px;}
    .chat-hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;}
    .chat-title{font-weight:900;}
    .chat-log{border:1px solid #eee;border-radius:10px;background:#fafafa;height:420px;overflow:auto;padding:10px;font-size:14px;}
    .chat-row{display:flex;gap:8px;margin-top:10px;}
    .chat-input{flex:1;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:14px;}
    .chat-send{border:1px solid #ddd;border-radius:10px;padding:10px 14px;font-weight:900;background:#fff;cursor:pointer;}
    .chat-send:hover{background:#f7f7f7;}

    .chat-card{
        margin-top:6px;
        border:1px solid #eee;
        border-radius:12px;
        background:#fff;
        padding:10px;
        /* 채팅용 크기 제한 */
        max-height: 260px;
        overflow-y: auto;
    }
    /* TOP10 카드 리스트 */
    .t10-list{display:flex;flex-direction:column;gap:10px;}

    .t10-item{
        display:flex;align-items:center;gap:12px;
        text-decoration:none;color:inherit;
        border:1px solid #e5e5e5;border-radius:14px;background:#fff;
        padding:10px 12px;
        transition: transform .08s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
        cursor:pointer;
    }

    .t10-item:hover{
        background:#fcfcfc;
        border-color:#cfcfcf;
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(0,0,0,.06);
    }

    .t10-item:active{transform: translateY(0); box-shadow:none;}
    .t10-item:focus-visible{outline:2px solid #111; outline-offset:2px;}

    .t10-rank{
        width:32px;height:32px;border-radius:10px;
        display:flex;align-items:center;justify-content:center;
        font-weight:900;border:1px solid #ddd;background:#fafafa;
        flex:0 0 auto;
    }

    .t10-thumb{
        width:56px;height:56px;border-radius:12px;
        border:1px solid #eee;background:#fafafa;
        display:flex;align-items:center;justify-content:center;
        overflow:hidden;flex:0 0 auto;
    }

    .t10-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .t10-thumb.noimg{background:#f4f4f4;}
    .t10-noimg{font-size:11px;color:#999;font-weight:900;}

    .t10-body{flex:1;min-width:0;}
    .t10-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .t10-meta{margin-top:6px;font-size:13px;color:#666;display:flex;gap:10px;flex-wrap:wrap;}
    .t10-cta{font-weight:900;color:#111;opacity:.8;flex:0 0 auto;}
</style>



<div th:replace="common/footer :: footer"></div>
</body>
</html>
