<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="admin/_header :: adminHeader"></div>

<div th:replace="admin/_layout :: adminLayout(${title}, ~{::content})">
    <div th:fragment="content">

        <form method="post" th:action="@{/admin/notices}">
            <div style="margin-bottom:10px;">
                <div style="font-weight:800; margin-bottom:6px;">제목</div>
                <input class="input" name="title" required maxlength="200" placeholder="제목">
            </div>

            <div style="margin-bottom:10px;">
                <div style="font-weight:800; margin-bottom:6px;">내용</div>
                <textarea class="input" name="content" required rows="12"
                          placeholder="내용을 입력하세요"></textarea>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <a class="btn" th:href="@{/admin/notices}">목록</a>
                <button class="btn btn-primary" type="submit">등록</button>
            </div>
        </form>

    </div>
</div>

</body>
</html>
