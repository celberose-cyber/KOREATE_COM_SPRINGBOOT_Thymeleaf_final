<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 크롤링 실행</title>
</head>
<body>

<!-- ✅ 대시보드와 동일: 관리자 헤더 -->
<div th:replace="~{admin/_header :: adminHeader}"></div>

<!-- ✅ 대시보드와 동일: adminLayout 래핑 -->
<div th:replace="~{admin/_layout :: adminLayout(${title}, ~{::content})}">
    <div th:fragment="content">

        <div class="card">
            <h3 style="margin:0 0 10px;">관리자 크롤링 실행</h3>

            <!-- ✅ 메시지 박스: 대시보드 톤에 맞춘 스타일 -->
            <div th:if="${message}" class="alert ok" th:text="${message}"></div>
            <div th:if="${error}"   class="alert err" th:text="${error}"></div>

            <!-- ✅ 폼: 대시보드 filter 스타일 계열로 통일 -->
            <form method="post" th:action="@{/admin/crawl}" class="filter">
                <label>카테고리</label>
                <select name="category">
                    <option value="computer" th:selected="${category=='computer'}">컴퓨터</option>
                    <option value="mouse"    th:selected="${category=='mouse'}">마우스</option>
                    <option value="keyboard" th:selected="${category=='keyboard'}">키보드</option>
                    <option value="monitor"  th:selected="${category=='monitor'}">모니터</option>
                    <option value="speaker"  th:selected="${category=='speaker'}">스피커</option>
                </select>

                <label>페이지수(1~10)</label>
                <input type="number" name="maxPages" min="1" max="10"
                       th:value="${maxPages != null ? maxPages : 3}" />

                <button type="submit">크롤링 실행</button>
            </form>

            <p class="muted" style="margin-top:12px;">
                * robots.txt 및 요청 간격을 준수하고, 수집 결과는 내부 DB에서만 사용합니다.
            </p>
        </div>

        <!-- ✅ 스타일: 대시보드 화면과 유사하게 재사용/동일 톤 -->
        <style>
            .card{border:1px solid #e5e5e5;border-radius:12px;background:#fff;padding:16px;margin-top:12px;}
            .muted{color:#777;font-size:13px;}

            /* 대시보드 filter와 같은 계열 */
            .filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0;}
            .filter input,.filter select{
              border:1px solid #ddd;border-radius:10px;padding:8px 10px;
            }
            .filter button{
              border:1px solid #111;background:#111;color:#fff;border-radius:10px;
              padding:8px 12px;font-weight:900;cursor:pointer;
            }
            .filter button:hover{background:#000;}

            /* 메시지 박스 */
            .alert{margin:0 0 12px;border-radius:10px;padding:10px 12px;font-size:13px;}
            .alert.ok{background:#f3fff6;border:1px solid #bfe7c7;color:#1b6b2a;}
            .alert.err{background:#fff5f5;border:1px solid #f1b3b3;color:#8a1f1f;}
        </style>

    </div>
</div>

</body>
</html>
