<!-- =========================
2) 회원정보(profile.html or user.html) - 카드형
========================= -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원정보</title>
</head>
<body>

<div th:replace="common/header :: header"></div>

<div class="wrap">
    <div class="card">
        <div class="card-hd">
            <h2 class="title">회원정보</h2>
            <span class="badge" th:text="${user.grade}">GRADE</span>
        </div>

        <!-- ✅ 테이블 대신 “필드 리스트” 스타일 -->
        <div class="kv-row">
            <div class="kv-k">아이디</div>
            <div class="kv-v" th:text="${user.username}">jack2</div>
        </div>

        <div class="kv-row">
            <div class="kv-k">인증 이메일</div>
            <div class="kv-v" th:text="${user.verifyEmail}">jack2@gmail.com</div>
        </div>
        <div class="kv">
            <div class="kv-row">
                <div class="kv-k">이름</div>
                <div class="kv-v" th:text="${user.name}">홍길동</div>
            </div>

            <div class="kv-row">
                <div class="kv-k">등급</div>
                <div class="kv-v">
                    <span class="badge" th:text="${user.grade}">GOLD</span>
                </div>
            </div>

            <div class="kv-row">
                <div class="kv-k">권한</div>
                <div class="kv-v" th:text="${user.role}">USER</div>
            </div>

            <div class="kv-row">
                <div class="kv-k">누적 결제 금액</div>
                <div class="kv-v">
                    <b><span th:text="${#numbers.formatInteger(user.totalSpent, 0, 'COMMA')}">0</span></b> 원
                </div>
            </div>

            <div class="kv-row">
                <div class="kv-k">보유 포인트</div>
                <div class="kv-v">
                    <b><span th:text="${#numbers.formatInteger(user.pointBalance, 0, 'COMMA')}">0</span></b> P
                </div>
            </div>

            <!-- ✅ DB 정책 기반 등급혜택 -->
            <div class="kv-row">
                <div class="kv-k">등급 혜택</div>
                <div class="kv-v">
                    <div th:if="${policy != null}">
                        <div style="margin-bottom:6px;">
                            <b th:text="${policy.grade}">GOLD</b> 정책 적용
                            <span class="muted">
                (최소 기준: <span th:text="${#numbers.formatInteger(policy.minTotalSpent, 0, 'COMMA')}">0</span>원)
              </span>
                        </div>
                        <div>
                            할인 <b th:text="${#numbers.formatDecimal(policy.discountRate, 1, 'COMMA', 2, 'POINT')}">0.00</b>%
                            /
                            적립 <b th:text="${#numbers.formatDecimal(policy.pointRate, 1, 'COMMA', 2, 'POINT')}">0.00</b>%
                        </div>
                    </div>

                    <div th:if="${policy == null}" class="muted">
                        혜택 없음
                    </div>
                </div>
            </div>
        </div>

        <div class="row" style="justify-content:flex-end; margin-top:12px;">
            <a class="btn" th:href="@{/}">메인으로</a>
        </div>
    </div>
</div>

<style>
    .wrap{max-width:1100px;margin:0 auto;padding:20px;}
    .muted{color:#777;font-size:13px;}
    .card{border:1px solid #e5e5e5;border-radius:12px;background:#fff;padding:14px 16px;}
    .card-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid #eee;margin-bottom:10px;}
    .title{font-weight:900;margin:0;}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid #ddd;font-size:12px;font-weight:800;background:#fafafa;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .btn{padding:8px 10px;border-radius:10px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
    .btn:hover{background:#f7f7f7;}

    /* ✅ Key-Value 리스트 */
    .kv{display:flex;flex-direction:column;gap:10px;}
    .kv-row{
        display:grid;grid-template-columns:160px 1fr;gap:12px;
        padding:10px 12px;border:1px solid #eee;border-radius:12px;background:#fafafa;
    }
    .kv-k{font-weight:900;color:#333;}
    .kv-v{color:#111;}
    @media (max-width:720px){
        .kv-row{grid-template-columns:1fr;gap:6px;}
    }
</style>

<div th:replace="common/footer :: footer"></div>
</body>
</html>
