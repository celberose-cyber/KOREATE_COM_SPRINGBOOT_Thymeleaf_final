<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<div th:replace="common/header :: header"></div>

<div class="wrap">
    <div class="card">
        <div class="card-hd">
            <h2 class="title">회원가입</h2>
            <span class="badge">REGISTER</span>
        </div>

        <div th:if="${error}" class="alert" th:text="${error}">에러</div>
        <div th:if="${message}" class="ok" th:text="${message}">메시지</div>

        <form method="post" th:action="@{/register}">
            <input type="hidden" name="termsDocId" th:value="${terms != null ? terms.docId : ''}">
            <input type="hidden" name="privacyDocId" th:value="${privacy != null ? privacy.docId : ''}">

            <!-- ✅ 아이디(username) -->
            <div style="margin-bottom:10px;">
                <div class="muted" style="margin-bottom:6px;">아이디</div>

                <div class="row" style="gap:8px; align-items:center;">
                    <input class="input" id="username" name="username" required
                           th:value="${f_username}" placeholder="예: jack2"
                           style="flex:1;" />
                    <button class="btn" type="button" id="btnCheckUsername">중복확인</button>
                </div>

                <input type="hidden" id="usernameChecked" value="false">

                <div id="usernameMsg" class="muted" style="margin-top:8px;"></div>
                <div class="muted" style="margin-top:6px;">로그인에 사용할 아이디입니다. (이메일 아님)</div>
            </div>

            <div style="margin-bottom:10px;">
                <div class="muted" style="margin-bottom:6px;">이름</div>
                <input class="input" id="name" name="name" required
                       th:value="${f_name}" />
            </div>

            <div style="margin-bottom:10px;">
                <div class="muted" style="margin-bottom:6px;">전화번호</div>
                <input class="input" id="phone" name="phone" required placeholder="010-1234-5678"
                       th:value="${f_phone}" />
            </div>

            <div style="margin-bottom:10px;">
                <div class="muted" style="margin-bottom:6px;">비밀번호</div>
                <input class="input" type="password" id="password" name="password" required
                       minlength="6"
                       pattern="(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}"
                       placeholder="영문+숫자 포함 6자리 이상" />
            </div>
            <div class="muted" style="margin-top:6px;">
                * 비밀번호는 영문과 숫자를 포함한 6자리 이상
            </div>
            <!-- ✅ 인증 이메일(verifyEmail) + 인증코드 UI -->
            <div style="margin-bottom:10px;">
                <div class="muted" style="margin-bottom:6px;">인증 이메일</div>

                <div class="row" style="gap:8px; align-items:center;">
                    <input class="input" id="verifyEmail" name="verifyEmail" required
                           placeholder="예: jack2@gmail.com"
                           th:value="${f_verifyEmail}" />
                    <button class="btn" type="button" id="btnSendCode">인증코드 발송</button>
                </div>
                    <input type="hidden" id="emailVerified" value="false">
                <div class="muted" style="margin-top:6px;">
                    이메일 인증은 이 주소로 진행됩니다.
                </div>

                <div id="emailMsg" class="muted" style="margin-top:8px;"></div>

                <div id="codeBox" style="display:none; margin-top:10px;">
                    <div class="muted" style="margin-bottom:6px;">인증코드</div>
                    <div class="row" style="gap:8px; align-items:center;">
                        <input class="input" id="verifyCode" placeholder="6자리 숫자" />
                        <button class="btn" type="button" id="btnVerifyCode">확인</button>
                    </div>
                    <div id="codeMsg" class="muted" style="margin-top:8px;"></div>
                </div>

                <div id="verifiedOk" class="ok" style="display:none; margin-top:10px;">
                    이메일 인증이 완료되었습니다.
                </div>
            </div>


            <script>
                const $ = (id) => document.getElementById(id);

                function setMsg(el, text, ok=false) {
                  el.textContent = text || "";
                  el.style.color = ok ? "#116329" : "#b42318";
                  el.style.fontWeight = "800";
                }

                const form = document.querySelector("form");

                // ------------------------
                // 1) 아이디 중복확인
                // ------------------------
                const btnCheckUsername = $("btnCheckUsername");
                const usernameMsg = $("usernameMsg");

                $("username").addEventListener("input", () => {
                  $("usernameChecked").value = "false";
                  setMsg(usernameMsg, "", true);
                });

                btnCheckUsername.addEventListener("click", async () => {
                  const u = $("username").value.trim();
                  if (!u) { alert("아이디를 입력해주세요."); return; }

                  $("usernameChecked").value = "false";
                  btnCheckUsername.disabled = true;
                  setMsg(usernameMsg, "중복 확인 중...", true);

                  try {
                    const res = await fetch("/api/user/check-username", {
                      method: "POST",
                      headers: {"Content-Type": "application/x-www-form-urlencoded"},
                      body: new URLSearchParams({ username: u })
                    });
                    const json = await res.json();

                    if (json.success && json.available) {
                      setMsg(usernameMsg, json.message || "사용 가능한 아이디입니다.", true);
                      $("usernameChecked").value = "true";
                    } else {
                      setMsg(usernameMsg, json.message || "사용할 수 없는 아이디입니다.", false);
                      $("usernameChecked").value = "false";
                    }
                  } catch (e) {
                    setMsg(usernameMsg, "확인 실패: " + e, false);
                    $("usernameChecked").value = "false";
                  } finally {
                    btnCheckUsername.disabled = false;
                  }
                });

                // ------------------------
                // 2) 이메일 인증(발송/확인)
                // ------------------------
                const btnSend = $("btnSendCode");
                const btnVerify = $("btnVerifyCode");

                $("verifyEmail").addEventListener("input", () => {
                  $("emailVerified").value = "false";
                  $("verifiedOk").style.display = "none";
                });

                btnSend.addEventListener("click", async () => {
                  const email = $("verifyEmail").value.trim();
                  if (!email) { alert("이메일을 입력해주세요."); return; }

                  $("emailVerified").value = "false";
                  $("verifiedOk").style.display = "none";

                  btnSend.disabled = true;
                  setMsg($("emailMsg"), "인증코드 발송 중...", true);

                  try {
                    const res = await fetch("/api/email/send-code", {
                      method: "POST",
                      headers: {"Content-Type": "application/x-www-form-urlencoded"},
                      body: new URLSearchParams({ verifyEmail: email, purpose: "REGISTER" })
                    });
                    const json = await res.json();

                    if (json.success) {
                      setMsg($("emailMsg"), json.message, true);
                      $("codeBox").style.display = "block";
                      setMsg($("codeMsg"), "", true);
                    } else {
                      setMsg($("emailMsg"), json.message, false);
                    }
                  } catch (e) {
                    setMsg($("emailMsg"), "발송 실패: " + e, false);
                  } finally {
                    btnSend.disabled = false;
                  }
                });

                btnVerify.addEventListener("click", async () => {
                  const email = $("verifyEmail").value.trim();
                  const code = $("verifyCode").value.trim();
                  if (!email) { alert("이메일을 입력해주세요."); return; }
                  if (!code) { alert("인증코드를 입력해주세요."); return; }

                  btnVerify.disabled = true;
                  setMsg($("codeMsg"), "인증 확인 중...", true);

                  try {
                    const res = await fetch("/api/email/verify-code", {
                      method: "POST",
                      headers: {"Content-Type": "application/x-www-form-urlencoded"},
                      body: new URLSearchParams({ verifyEmail: email, code: code, purpose: "REGISTER" })
                    });
                    const json = await res.json();

                    if (json.success) {
                      setMsg($("codeMsg"), json.message, true);
                      $("verifiedOk").style.display = "block";
                      $("emailVerified").value = "true";
                    } else {
                      setMsg($("codeMsg"), json.message, false);
                      $("verifiedOk").style.display = "none";
                      $("emailVerified").value = "false";
                    }
                  } catch (e) {
                    setMsg($("codeMsg"), "인증 실패: " + e, false);
                    $("verifiedOk").style.display = "none";
                    $("emailVerified").value = "false";
                  } finally {
                    btnVerify.disabled = false;
                  }
                });

                // ------------------------
                // 3) 제출 전 최종 체크
                // ------------------------
                form.addEventListener("submit", (e) => {
                  if ($("usernameChecked").value !== "true") {
                    e.preventDefault();
                    alert("아이디 중복확인을 먼저 완료해주세요.");
                    return;
                  }
                  if ($("emailVerified").value !== "true") {
                    e.preventDefault();
                    alert("이메일 인증을 먼저 완료해주세요.");
                    return;
                  }
                });
            </script>




            <!-- 이용약관 -->
            <div class="policy-box">
                <div class="policy-hd">
                    <div class="policy-title" th:text="${terms != null ? terms.title : '이용약관'}">이용약관</div>
                    <div class="muted" th:text="${terms != null ? ('버전: ' + terms.version) : ''}">버전</div>
                </div>
                <div class="policy-body" th:if="${terms != null}" th:utext="${terms.html}">
                    약관 내용
                </div>
                <div class="policy-body" th:if="${terms == null}">
                    활성 이용약관(TERMS)이 없습니다. DB에 is_active=1을 설정하세요.
                </div>
            </div>

            <label class="checkline">
                <input type="checkbox" name="termsAgreed" value="true"
                       style="margin-top:3px;" th:checked="${f_termsAgreed}" />
                <span>이용약관에 동의합니다. <span class="muted">(필수)</span>
          <a th:href="@{/policy/terms}" style="margin-left:6px;">새창보기</a>
        </span>
            </label>

            <!-- 개인정보 -->
            <div class="policy-box">
                <div class="policy-hd">
                    <div class="policy-title" th:text="${privacy != null ? privacy.title : '개인정보처리방침'}">개인정보처리방침</div>
                    <div class="muted" th:text="${privacy != null ? ('버전: ' + privacy.version) : ''}">버전</div>
                </div>
                <div class="policy-body" th:if="${privacy != null}" th:utext="${privacy.html}">
                    개인정보 내용
                </div>
                <div class="policy-body" th:if="${privacy == null}">
                    활성 개인정보처리방침(PRIVACY)이 없습니다. DB에 is_active=1을 설정하세요.
                </div>
            </div>

            <label class="checkline">
                <input type="checkbox" name="privacyAgreed" value="true"
                       style="margin-top:3px;" th:checked="${f_privacyAgreed}" />
                <span>개인정보처리방침에 동의합니다. <span class="muted">(필수)</span>
          <a th:href="@{/policy/privacy}" style="margin-left:6px;">새창보기</a>
        </span>
            </label>

            <div class="row" style="justify-content:flex-end; margin-top:12px;">
                <a class="btn" th:href="@{/login}">로그인으로</a>
                <button class="btn btn-primary" type="submit">가입</button>
            </div>
        </form>
    </div>
</div>

<style>
    .wrap{max-width:1100px;margin:0 auto;padding:20px;}
    .muted{color:#777;font-size:13px;}
    .card{border:1px solid #e5e5e5;border-radius:12px;background:#fff;padding:14px 16px;max-width:720px;margin:0 auto;}
    .card-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid #eee;margin-bottom:10px;}
    .title{font-weight:900;margin:0;}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid #ddd;font-size:12px;font-weight:800;background:#fafafa;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .btn{padding:8px 10px;border-radius:10px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
    .btn:hover{background:#f7f7f7;}
    .btn-primary{border-color:#111;background:#111;color:#fff;}
    .btn-primary:hover{background:#000;}
    .input{padding:10px 12px;border:1px solid #ddd;border-radius:10px;width:100%;font-size:14px;box-sizing:border-box;}
    .alert{border:1px solid #f2b8b5;background:#fff5f5;color:#b42318;padding:10px 12px;border-radius:12px;font-weight:800;margin-bottom:10px;}
    .ok{border:1px solid #b7ebc6;background:#f6fffa;color:#116329;padding:10px 12px;border-radius:12px;font-weight:800;margin-bottom:10px;}
    .policy-box{border:1px solid #eee;border-radius:12px;background:#fafafa;margin-top:12px;}
    .policy-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 12px;border-bottom:1px solid #eee;}
    .policy-title{font-weight:900;}
    .policy-body{padding:10px 12px;max-height:220px;overflow:auto;background:#fff;border-radius:0 0 12px 12px;font-size:13px;line-height:1.45;}
    .policy-body h1,.policy-body h2,.policy-body h3{margin:10px 0 6px;}
    .policy-body p{margin:6px 0;}
    .policy-body ul{margin:6px 0 6px 18px;}
    .checkline{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-weight:800;}
</style>

<div th:replace="common/footer :: footer"></div>
</body>
</html>
