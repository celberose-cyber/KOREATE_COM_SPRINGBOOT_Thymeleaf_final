<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>아이디 찾기 결과</title>
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="wrap">
  <div class="card">
    <h2 class="title">아이디 찾기 결과</h2>

    <!-- count == 0 -->
    <div class="alert" th:if="${count == 0}">
      입력하신 정보로 확인 가능한 계정이 없습니다.
    </div>

    <!-- count > 0 -->
    <div class="ok" th:if="${count > 0}">
      입력하신 정보로 확인 가능한 계정이 <b th:text="${count}">1</b>개 있습니다.<br/>
      아이디 목록을 인증된 이메일로 안내했습니다.
    </div>

    <div style="margin-top:12px;">
      <a class="btn btn-primary" th:href="@{/login}">로그인으로</a>
      <a class="btn" th:href="@{/find-id}">다시 찾기</a>
    </div>
  </div>
</div>

<style>
  .wrap{max-width:900px;margin:0 auto;padding:20px;}
  .card{border:1px solid #e5e5e5;border-radius:12px;background:#fff;padding:14px 16px;max-width:560px;margin:0 auto;}
  .title{font-weight:900;margin:0 0 10px;}
  .ok{border:1px solid #b7ebc6;background:#f6fffa;color:#116329;padding:10px 12px;border-radius:12px;font-weight:800;margin-bottom:10px;}
  .alert{border:1px solid #f2b8b5;background:#fff5f5;color:#b42318;padding:10px 12px;border-radius:12px;font-weight:800;margin-bottom:10px;}
  .btn{padding:8px 10px;border-radius:10px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{border-color:#111;background:#111;color:#fff;}
  .btn-primary:hover{background:#000;}
</style>

<div th:replace="common/footer :: footer"></div>
</body>
</html>
