<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>주문/결제</title>
  <style>
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 18px; align-items:start; }
    .card { border: 1px solid #e5e5e5; border-radius: 10px; background:#fff; padding: 16px; }
    .h { font-size: 18px; font-weight: 800; margin: 0 0 12px; }
    .row { display:flex; gap:10px; align-items:center; margin: 10px 0; }
    .row label { width: 90px; color:#444; font-weight:700; }
    .row input, .row select, .row textarea { flex:1; padding: 10px; border:1px solid #ddd; border-radius: 8px; }
    .muted { color:#777; font-size: 13px; }
    .items { display:flex; flex-direction:column; gap: 12px; }
    .item { display:flex; gap:12px; }
    .thumb { width: 72px; height: 72px; border:1px solid #eee; border-radius: 8px; overflow:hidden; flex:0 0 auto;
      display:flex; align-items:center; justify-content:center; background:#fafafa; }
    .thumb img { width:100%; height:100%; object-fit:cover; }
    .it-info { flex:1; min-width:0; }
    .it-name { font-weight:800; line-height:1.3; }
    .it-meta { margin-top:4px; font-size: 13px; color:#555; }
    .money { font-weight:900; }
    .sumline { display:flex; justify-content:space-between; margin:8px 0; }
    .sumline strong { font-size: 15px; }
    .total { font-size: 18px; font-weight: 900; }
    .btn { width:100%; padding: 14px 14px; border:none; border-radius: 10px; cursor:pointer; font-weight:900; }
    .btn-pay { background:#ff7a00; color:#fff; }
    .btn-pay:hover { background:#e66a00; }
    .stick { position: sticky; top: 16px; }
    @media (max-width: 860px){
      .grid { grid-template-columns: 1fr; }
      .stick { position: static; }
    }
  </style>
</head>
<body>

<div th:replace="common/header :: header"></div>

<div class="wrap">
  <h2 style="margin:0 0 14px;">주문/결제</h2>

  <!-- ✅ 한 폼으로 묶어서 submit -->
  <form th:action="@{/order/checkout}" method="post">
    <div class="grid">

      <!-- 왼쪽: 배송지/결제수단 -->
      <div class="card">
        <div class="h">배송지 정보</div>

        <!-- (선택) 우편번호 + 주소검색 버튼은 나중에 JS로 붙이기 쉬운 구조 -->
        <div class="row">
          <label>주소</label>
          <textarea name="address" rows="3" placeholder="배송지 주소를 입력하세요" required></textarea>
        </div>

        <div class="row">
          <label>요청사항</label>
          <input name="memo" placeholder="(선택) 배송 요청사항" />
        </div>

        <hr style="border:none; border-top:1px solid #eee; margin:16px 0;">

        <div class="h">결제 수단</div>

        <div style="display:flex; gap:12px; align-items:center; margin-bottom:10px;">
          <img th:src="@{/images/kakaopay.png}" alt="kakaopay" style="height:22px;">
          <span class="muted">카카오페이를 선택하면 결제창으로 이동합니다.</span>
        </div>

        <div class="row">
          <label>방법</label>
          <select name="payMethod" required>
            <option value="CARD">카드(연동 전)</option>
            <option value="BANK">무통장(연동 전)</option>
            <option value="KAKAO">카카오페이</option>
          </select>
        </div>

        <div class="muted">
          결제 버튼을 누르면 주문이 생성되고, 과제에서는 결제가 성공했다고 가정하여 바로 결제완료(PAID) 처리합니다.
        </div>
      </div>

      <!-- 오른쪽: 주문 요약 + 최종 결제 -->
      <div class="stick">
        <div class="card">
          <div class="h">주문 상품</div>

          <div class="items">
            <div class="item" th:each="c : ${cart}">
              <div class="thumb">
                <img th:if="${c.thumbnailUrl}" th:src="${c.thumbnailUrl}" alt="thumb"/>
                <span th:if="${c.thumbnailUrl == null}" class="muted">no image</span>
              </div>

              <div class="it-info">
                <div class="it-name" th:text="${c.productName}">상품명</div>
                <div class="it-meta">
                  수량 <b th:text="${c.quantity}">1</b>개 ·
                  단가 <span th:text="${#numbers.formatInteger(c.unitPrice, 0, 'COMMA')}">0</span>원
                </div>
              </div>

              <div class="money">
                <span th:text="${#numbers.formatInteger(c.unitPrice * c.quantity, 0, 'COMMA')}">0</span>원
              </div>
            </div>
          </div>

          <hr style="border:none; border-top:1px solid #eee; margin:16px 0;">

          <!-- ✅ 합계/할인/적립 표시 (컨트롤러에서 숫자 만들어서 넘기면 가장 깔끔) -->
          <div class="h">결제 요약</div>

          <div class="sumline">
            <span>상품 합계</span>
            <span><b th:text="${#numbers.formatInteger(summary.itemsTotal, 0, 'COMMA')}">0</b>원</span>
          </div>

          <div class="sumline">
            <span>등급 할인 (<span th:text="${summary.discountRate}">0</span>%)</span>
            <span>- <b th:text="${#numbers.formatInteger(summary.discountAmount, 0, 'COMMA')}">0</b>원</span>
          </div>

          <div class="sumline">
            <span>배송비</span>
            <span><b th:text="${#numbers.formatInteger(summary.shippingFee, 0, 'COMMA')}">0</b>원</span>
          </div>

          <hr style="border:none; border-top:1px solid #eee; margin:12px 0;">

          <div class="sumline">
            <strong>최종 결제금액</strong>
            <span class="total">
              <span th:text="${#numbers.formatInteger(summary.finalTotal, 0, 'COMMA')}">0</span>원
            </span>
          </div>

          <div class="sumline muted">
            <span>예상 적립 (<span th:text="${summary.pointRate}">0</span>%)</span>
            <span>+ <b th:text="${#numbers.formatInteger(summary.earnPoint, 0, 'COMMA')}">0</b>P</span>
          </div>

          <button class="btn btn-pay" type="submit" style="margin-top:12px;">
            결제하기
          </button>

          <div class="muted" style="margin-top:10px;">
            결제 시점의 등급/할인율/적립률은 주문서에 스냅샷으로 저장됩니다.
          </div>
        </div>
      </div>

    </div>
  </form>
</div>

<div th:replace="common/footer :: footer"></div>
</body>
</html>
